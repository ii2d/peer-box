<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Top Face Gradient -->
    <linearGradient id="topFaceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Left Face Gradient -->
    <linearGradient id="leftFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Right Face Gradient -->
    <linearGradient id="rightFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Radial Glows (Zero filter overhead, 100% portable) -->
    <radialGradient id="indigoAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Squircle (App Badge) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.45"/>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="264" r="160" fill="url(#indigoAmbientGlow)"/>
  <circle cx="256" cy="230" r="130" fill="url(#cyanAmbientGlow)"/>

  <!-- P2P Orbital Data Ring -->
  <ellipse cx="256" cy="264" rx="185" ry="95" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="10 8" transform="rotate(-18 256 264)"/>

  <!-- Isometric Faceted Cube -->
  <!-- Left Face -->
  <polygon points="132,192 256,264 256,408 132,336" fill="url(#leftFaceGrad)"/>

  <!-- Right Face -->
  <polygon points="256,264 380,192 380,336 256,408" fill="url(#rightFaceGrad)"/>

  <!-- Top Face -->
  <polygon points="256,120 380,192 256,264 132,192" fill="url(#topFaceGrad)"/>

  <!-- Highlight Edges -->
  <polyline points="132,192 256,264 380,192" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.65" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="256" y1="264" x2="256" y2="408" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round"/>
  <polyline points="132,336 132,192 256,120 380,192 380,336 256,408 132,336" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.3" stroke-linejoin="round"/>

  <!-- Internal P2P Mesh Beams -->
  <line x1="256" y1="264" x2="256" y2="120" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 6" stroke-opacity="0.8"/>
  <line x1="256" y1="264" x2="132" y2="336" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="0.75"/>
  <line x1="256" y1="264" x2="380" y2="336" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="0.75"/>

  <!-- Vertex Peer Nodes -->
  <!-- Top Node -->
  <circle cx="256" cy="120" r="22" fill="url(#nodeGlowCyan)"/>
  <circle cx="256" cy="120" r="9" fill="#38bdf8"/>
  <circle cx="256" cy="120" r="4.5" fill="#ffffff"/>

  <!-- Left-Top Node -->
  <circle cx="132" cy="192" r="20" fill="url(#nodeGlowIndigo)"/>
  <circle cx="132" cy="192" r="8" fill="#818cf8"/>
  <circle cx="132" cy="192" r="4" fill="#ffffff"/>

  <!-- Right-Top Node -->
  <circle cx="380" cy="192" r="20" fill="url(#nodeGlowCyan)"/>
  <circle cx="380" cy="192" r="8" fill="#38bdf8"/>
  <circle cx="380" cy="192" r="4" fill="#ffffff"/>

  <!-- Bottom-Left Node -->
  <circle cx="132" cy="336" r="16" fill="url(#nodeGlowIndigo)"/>
  <circle cx="132" cy="336" r="7.5" fill="#6366f1"/>
  <circle cx="132" cy="336" r="3.5" fill="#ffffff"/>

  <!-- Bottom-Right Node -->
  <circle cx="380" cy="336" r="16" fill="url(#nodeGlowCyan)"/>
  <circle cx="380" cy="336" r="7.5" fill="#0284c7"/>
  <circle cx="380" cy="336" r="3.5" fill="#ffffff"/>

  <!-- Bottom-Center Node -->
  <circle cx="256" cy="408" r="18" fill="url(#nodeGlowIndigo)"/>
  <circle cx="256" cy="408" r="8" fill="#818cf8"/>
  <circle cx="256" cy="408" r="4" fill="#ffffff"/>

  <!-- Central Hub Node (Main Peer Router) -->
  <circle cx="256" cy="264" r="32" fill="url(#nodeGlowCyan)"/>
  <circle cx="256" cy="264" r="12" fill="#0284c7"/>
  <circle cx="256" cy="264" r="6" fill="#ffffff"/>
</svg>
