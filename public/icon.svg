<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="106" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>

  <!-- P2P Orbital Ring / Orbit Dash -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12 12" stroke-opacity="0.3"/>

  <!-- Isometric Box / Peer Hub -->
  <!-- Top Face -->
  <polygon points="256,120 376,190 256,260 136,190" fill="url(#topGrad)" opacity="0.95"/>

  <!-- Left Face -->
  <polygon points="136,190 256,260 256,390 136,320" fill="url(#indigoGrad)" opacity="0.9"/>

  <!-- Right Face -->
  <polygon points="256,260 376,190 376,320 256,390" fill="url(#cyanGrad)" opacity="0.9"/>

  <!-- Isometric Box Highlight Edges -->
  <polyline points="136,190 256,260 376,190" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4"/>
  <line x1="256" y1="260" x2="256" y2="390" stroke="#ffffff" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Peer Nodes on Vertices -->
  <!-- Center Node -->
  <circle cx="256" cy="260" r="14" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="260" r="8" fill="#0284c7"/>

  <!-- Outer Peer Nodes -->
  <circle cx="256" cy="120" r="10" fill="#38bdf8"/>
  <circle cx="376" cy="190" r="10" fill="#818cf8"/>
  <circle cx="376" cy="320" r="10" fill="#38bdf8"/>
  <circle cx="256" cy="390" r="10" fill="#818cf8"/>
  <circle cx="136" cy="320" r="10" fill="#38bdf8"/>
  <circle cx="136" cy="190" r="10" fill="#818cf8"/>

  <!-- Connecting Node Beams -->
  <line x1="256" y1="260" x2="256" y2="120" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.7"/>
  <line x1="256" y1="260" x2="376" y2="320" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.7"/>
  <line x1="256" y1="260" x2="136" y2="320" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.7"/>
</svg>
